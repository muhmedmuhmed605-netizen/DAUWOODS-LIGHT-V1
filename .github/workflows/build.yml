name: Build DAUWOODS LIGHT APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build C++ Library
      run: |
        echo "Searching for C++ source file..."
        ls -la
        mkdir -p output
        # البحث التلقائي عن أي ملف cxx وبناؤه مباشرة بدون مشاكل مسافات
        g++ -shared -fPIC *.cxx -o output/libdauwoodlight.so
        echo "Build compiled successfully!"

    - name: Save Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DAUWOODS-LIGHT-BUILD
        path: output/
        
