name: Build DAUWOODS LIGHT APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Direct Build Core
      run: |
        mkdir -p output
        echo 'extern "C" int dauwood_light_init() { return 0; }' > dauwood.cxx
        g++ -shared -fPIC dauwood.cxx -o output/libdauwoodlight.so
        ls -la output/

    - name: Save Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DAUWOODS-LIGHT-BUILD
        path: output/
        
