name: Build DAUWOODS LIGHT APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build C++ Library
      run: |
        echo "Starting DAUWOODS LIGHT compilation..."
        mkdir -p output
        g++ -shared -fPIC "DAUWOODS LIGHT.cxx" -o output/libdauwoodlight.so
        echo "Build compiled successfully!"

    - name: Save Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DAUWOODS-LIGHT-BUILD
        path: output/
        
