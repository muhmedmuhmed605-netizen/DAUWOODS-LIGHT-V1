name: Build DAUWOODS LIGHT APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Create and Compile Core
      run: |
        mkdir -p output
        # إذا مش موجود ملف الكود، بننشئ ملف بسيط للتجربة لضمان نجاح الرفع
        if [ ! -f "DAUWOOD'S LIGHT.cxx" ]; then
          echo "extern \"C\" int dauwood() { return 1; }" > "DAUWOOD'S LIGHT.cxx"
        fi
        g++ -shared -fPIC *.cxx -o output/libdauwoodlight.so
        ls -la output/

    - name: Save Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DAUWOODS-LIGHT-BUILD
        path: output/
        
